<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Jev guard</title>
<style>
	:root {
		--bg: #f6f6f3;
		--panel: #ffffff;
		--line: #e3e3de;
		--line-strong: #cfcfc8;
		--ink: #1d1d1b;
		--muted: #6d6d67;
		--faint: #a3a39c;
		--accent: #2b59c3;
		--accent-soft: #e9eefa;
		--danger: #b3261e;
		--danger-soft: #fbeceb;
		--pass: #1a7f37;
		--pass-soft: #e7f5ec;
		--amber: #8a5a00;
		--amber-soft: #fff4d6;
		--radius: 8px;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; }
	body {
		font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
		color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased;
		display: grid; grid-template-rows: auto 1fr;
	}
	button, input, textarea { font: inherit; color: inherit; }
	.num { font-variant-numeric: tabular-nums; }

	header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
	header .brand { font-weight: 600; letter-spacing: -0.01em; }
	header .name { flex: 1; max-width: 420px; border: 1px solid transparent; background: transparent; padding: 4px 8px; border-radius: 6px; font-weight: 500; }
	header .name:hover { border-color: var(--line); }
	header .name:focus { outline: none; border-color: var(--accent); background: var(--panel); }
	header .saved { color: var(--faint); font-size: 12px; }
	header .status { margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--pass-soft); color: var(--pass); font-weight: 500; }
	header .status.off { background: #eeeeea; color: var(--muted); }

	main { display: grid; grid-template-columns: 200px minmax(420px, 520px) 1fr; min-height: 0; }
	main > section { overflow: auto; min-height: 0; padding: 16px 18px 32px; }
	.rail { border-right: 1px solid var(--line); padding: 12px 8px !important; }
	.policy { border-right: 1px solid var(--line); }
	h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; margin: 4px 8px 8px; }
	.rail a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.rail a:hover { background: #ececE7; }
	.rail a.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

	.hint { color: var(--muted); font-size: 12px; margin: 0; }
	.about { font-size: 15px; margin: 0 0 10px; }
	.steps { margin: 0 0 20px; padding-left: 20px; color: var(--muted); font-size: 13px; }
	.section { margin-top: 22px; }
	.section:first-of-type { margin-top: 0; }
	.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
	.section-head h3 { font-size: 16px; margin: 0 0 2px; letter-spacing: -0.01em; }

	.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 12px; margin-bottom: 10px; }
	.card-head { display: grid; grid-template-columns: 1fr auto 24px; gap: 6px; align-items: center; margin-bottom: 6px; }
	.card-head.two { grid-template-columns: 1fr 24px; }
	.caption { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
	input.box, textarea.box { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 6px 8px; transition: border-color 120ms ease; }
	input.box:hover, textarea.box:hover { border-color: var(--line-strong); }
	input.box:focus, textarea.box:focus { outline: none; border-color: var(--accent); }
	textarea.box { resize: vertical; min-height: 34px; }
	input.box.title-box { border-color: transparent; background: transparent; padding: 2px 0; font-weight: 600; }
	input.box.title-box:focus { box-shadow: inset 0 -1px 0 var(--accent); }
	.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }

	.icon { width: 24px; height: 28px; border: 0; background: transparent; color: var(--faint); border-radius: 6px; cursor: pointer; font-size: 16px; line-height: 1; }
	.icon:hover { color: var(--danger); background: var(--danger-soft); }
	.add { border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
	.add:hover { color: var(--accent); border-color: var(--accent); }
	.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

	.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
	.seg button { border: 0; background: var(--panel); padding: 4px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
	.seg button + button { border-left: 1px solid var(--line); }
	.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
	.seg.expect button.on.pass { background: var(--pass-soft); color: var(--pass); }
	.seg.expect button.on.flag { background: var(--danger-soft); color: var(--danger); }

	.chips { display: flex; flex-wrap: wrap; gap: 6px; }
	.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--panel); cursor: pointer; font-size: 13px; user-select: none; }
	.chip input { margin: 0; }
	.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
	.folder { display: grid; grid-template-columns: 1fr 24px; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fafaf8; margin-bottom: 6px; overflow-wrap: anywhere; }

	.primary { border: 0; background: var(--accent); color: #fff; font-weight: 600; padding: 7px 16px; border-radius: 7px; cursor: pointer; transition: transform 80ms ease, opacity 120ms ease; }
	.primary:active { transform: scale(0.97); }
	.primary:disabled { opacity: 0.55; cursor: default; }
	.secondary { border: 1px solid var(--line-strong); background: var(--panel); padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; }
	.secondary:hover { border-color: var(--accent); color: var(--accent); }

	.banner { border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
	.banner.error { background: var(--danger-soft); color: var(--danger); }
	.banner.info { background: var(--accent-soft); color: var(--accent); }
	.banner ul { margin: 4px 0 0; padding-left: 18px; }

	.score { font-size: 13px; color: var(--muted); }
	.score b { color: var(--ink); font-size: 15px; }
	.verdict { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
	.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
	.badge.pass { background: var(--pass-soft); color: var(--pass); }
	.badge.flag { background: var(--danger-soft); color: var(--danger); }
	.badge.note { background: #eeeeea; color: var(--muted); }
	.badge.warn { background: var(--amber-soft); color: var(--amber); }
	.match { font-size: 12px; margin-left: 6px; }
	.match.good { color: var(--pass); }
	.match.bad { color: var(--danger); font-weight: 600; }
	.bars { margin-top: 8px; }
	.bar-row { display: grid; grid-template-columns: minmax(120px, 200px) 1fr 40px; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 12px; }
	.track { position: relative; height: 8px; background: #eeeeea; border-radius: 4px; }
	.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: #c7cfe0; }
	.track .fill.fired { background: var(--danger); }
	.track .limit { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); opacity: 0.35; }
	.flagged-text { margin: 8px 0 0; padding: 8px 10px; border-left: 3px solid var(--danger); background: var(--danger-soft); border-radius: 0 6px 6px 0; font-size: 12px; white-space: pre-wrap; max-height: 140px; overflow: auto; }

	.log-row { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
	.log-row .meta { color: var(--muted); font-size: 12px; }
	.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<header>
	<span class="brand">Jev guard</span>
	<input class="name" id="name" aria-label="Guard name" placeholder="Guard name">
	<span class="saved" id="saved"></span>
	<span class="status off" id="status">Off</span>
</header>
<main>
	<section class="rail">
		<h2>Guards</h2>
		<nav id="policies"></nav>
		<div style="padding: 8px"><button class="add" id="new-policy">New guard</button></div>
	</section>
	<section class="policy" id="policy"></section>
	<section class="bench" id="bench"></section>
</main>
<script>
const SAVE_DELAY_MS = 500;
const LOG_REFRESH_MS = 10_000;
const SENSITIVITIES = [
	{ value: "relaxed", label: "Relaxed", hint: "Fires only when Jev is fairly sure (75% or more). Fewer false alarms." },
	{ value: "normal", label: "Normal", hint: "Fires at 50% or more." },
	{ value: "strict", label: "Strict", hint: "Fires at 30% or more. Catches more, with more false alarms." },
];
const ACTIONS = [
	{ value: "note", label: "Note it", hint: "Only record it in the log." },
	{ value: "warn", label: "Warn the agent", hint: "Tell the agent the text is untrusted and not to follow it." },
	{ value: "ask", label: "Ask me", hint: "Hide the flagged part and have the agent stop and ask you before going on." },
	{ value: "block", label: "Block it", hint: "Hide the flagged part and let the agent carry on without it." },
];
const SOURCES = [
	{ value: "web", label: "Web pages" },
	{ value: "files", label: "Files it reads" },
	{ value: "commands", label: "Command output" },
	{ value: "other", label: "MCP and other tools" },
];
// Filled from the server at start, so the page and the plugin share one starter list.
let STARTER_CHECKS = [];

const view = { slug: null, policy: null, errors: [], results: {}, tryText: "", tryResult: null, isTesting: false, testError: null, log: [], saveTimer: null };

// Builds a DOM node; string children become text, so user text is never parsed as HTML.
function el(tag, props = {}, ...children) {
	const node = document.createElement(tag);
	for (const [key, value] of Object.entries(props)) {
		if (key === "class") node.className = value;
		else if (key === "style" || key === "role" || key.startsWith("aria-")) node.setAttribute(key, value);
		else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
		else node[key] = value;
	}
	for (const child of children.flat(Infinity)) {
		if (child !== null && child !== undefined && child !== false) node.append(child);
	}
	return node;
}

// replaceChildren takes nodes only; this drops empty slots and flattens mapped lists.
const nodes = (...children) => children.flat(Infinity).filter((child) => child !== null && child !== undefined && child !== false);

async function api(path, options = {}) {
	const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
	const payload = await response.json();
	if (!response.ok) throw new Error(payload.error ?? `HTTP ${response.status}`);
	return payload;
}

const percent = (value) => `${Math.round(value * 100)}%`;
const isFlagged = (verdict) => verdict.checks.some((check) => check.isFired);
const actionLabel = (value) => ACTIONS.find((action) => action.value === value)?.label ?? value;

// Edits write into view.policy; structural changes re-render the policy column.
function edited({ isStructural = false } = {}) {
	if (isStructural) renderPolicy();
	renderStatus();
	clearTimeout(view.saveTimer);
	document.getElementById("saved").textContent = "Saving";
	view.saveTimer = setTimeout(save, SAVE_DELAY_MS);
}

async function save() {
	view.saveTimer = null;
	const { policy, errors } = await api(`/api/policies/${view.slug}`, { method: "PUT", body: JSON.stringify(view.policy) });
	view.policy.folders = policy.folders;
	view.policy.updatedAt = policy.updatedAt;
	view.errors = errors;
	document.getElementById("saved").textContent = errors.length > 0 ? "Saved, needs fixes" : "Saved";
	renderErrors();
	renderStatus();
	await loadPolicyList();
}

function textBox(target, key, props = {}) {
	return el("input", { class: "box", value: target[key] ?? "", oninput: (event) => { target[key] = event.target.value; edited(); }, ...props });
}

function areaBox(target, key, props = {}) {
	return el("textarea", { class: "box", rows: 2, value: target[key] ?? "", oninput: (event) => { target[key] = event.target.value; edited(); }, ...props });
}

function removeButton(list, index, what, afterRemove = () => edited({ isStructural: true })) {
	return el("button", { class: "icon", title: `Remove ${what}`, "aria-label": `Remove ${what}`, onclick: () => { list.splice(index, 1); afterRemove(); } }, "\u00d7");
}

function segmented(options, current, onPick, extraClass = "") {
	return el("div", { class: `seg ${extraClass}`, role: "group" },
		options.map((option) => el("button", { class: `${option.value === current ? "on" : ""} ${option.value}`, title: option.hint ?? "", onclick: () => onPick(option.value) }, option.label)),
	);
}

function sectionHead(title, explanation, ...actions) {
	return el("div", { class: "section-head" }, el("div", {}, el("h3", {}, title), el("p", { class: "hint" }, explanation)), actions.length ? el("div", { class: "row" }, actions) : null);
}

function renderStatus() {
	const status = document.getElementById("status");
	const policy = view.policy;
	const isOn = policy && policy.checks.length > 0 && (policy.everywhere || policy.folders.length > 0) && policy.sources.length > 0;
	status.className = `status ${isOn ? "" : "off"}`;
	status.textContent = !isOn ? "Off" : policy.everywhere ? "On for every folder" : `On for ${policy.folders.length} folder${policy.folders.length === 1 ? "" : "s"}`;
}

function renderErrors() {
	const holder = document.getElementById("policy-errors");
	if (!holder) return;
	holder.replaceChildren(view.errors.length > 0 ? el("div", { class: "banner error" }, "This guard will not run until these are fixed:", el("ul", {}, view.errors.map((message) => el("li", {}, message)))) : "");
}

function renderWhere() {
	const policy = view.policy;
	const folderInput = el("input", { class: "box mono", placeholder: "/path/to/a/folder" });
	const addFolder = () => {
		const path = folderInput.value.trim();
		if (!path) return;
		policy.folders.push(path);
		edited({ isStructural: true });
	};
	folderInput.addEventListener("keydown", (event) => { if (event.key === "Enter") addFolder(); });
	return el("div", { class: "section" },
		sectionHead("Where it runs", "The guard checks what Cline reads in these folders, including every folder inside them."),
		el("div", { class: "card" },
			policy.everywhere ? el("p", { class: "hint" }, "Guarding every folder. Folder-specific guards still win inside their own folders.") : null,
			policy.folders.map((folder, index) => el("div", { class: "folder mono" }, folder, removeButton(policy.folders, index, "folder"))),
			policy.folders.length === 0 && !policy.everywhere ? el("p", { class: "hint", style: "margin-bottom: 6px" }, "No folders yet, so this guard is off.") : null,
			el("div", { class: "row", style: "flex-wrap: nowrap" }, folderInput, el("button", { class: "secondary", onclick: addFolder }, "Add")),
			el("label", { class: "chip" + (policy.everywhere ? " on" : ""), style: "margin-top: 8px" },
				el("input", { type: "checkbox", checked: policy.everywhere, onchange: (event) => { policy.everywhere = event.target.checked; edited({ isStructural: true }); } }),
				"Guard every folder",
			),
			el("span", { class: "caption" }, "Check what the agent reads from"),
			el("div", { class: "chips" }, SOURCES.map((source) => {
				const isOn = policy.sources.includes(source.value);
				return el("label", { class: `chip ${isOn ? "on" : ""}` },
					el("input", { type: "checkbox", checked: isOn, onchange: (event) => {
						policy.sources = event.target.checked ? [...policy.sources, source.value] : policy.sources.filter((value) => value !== source.value);
						edited({ isStructural: true });
					} }),
					source.label,
				);
			})),
		),
	);
}

function renderChecks() {
	const checks = view.policy.checks;
	const addStarters = () => {
		const have = new Set(checks.map((check) => check.id));
		for (const starter of STARTER_CHECKS) if (!have.has(starter.id)) checks.push({ ...starter });
		edited({ isStructural: true });
	};
	return el("div", { class: "section" },
		sectionHead("Checks", "What to watch for. Each check is a yes/no question Jev answers about every piece of text the agent reads."),
		checks.map((check, index) => el("div", { class: "card" },
			el("div", { class: "card-head two" },
				textBox(check, "name", { placeholder: "Name this check, e.g. Asks to change payout details", className: "box title-box" }),
				removeButton(checks, index, "check"),
			),
			areaBox(check, "question", { placeholder: "Does this text ask to send money to a new account?" }),
			el("span", { class: "caption" }, "How strict"),
			segmented(SENSITIVITIES, check.sensitivity, (value) => { check.sensitivity = value; edited({ isStructural: true }); }),
			el("p", { class: "hint", style: "margin-top: 4px" }, SENSITIVITIES.find((option) => option.value === check.sensitivity)?.hint),
			el("span", { class: "caption" }, "If it fires"),
			segmented(ACTIONS, check.action, (value) => { check.action = value; edited({ isStructural: true }); }),
			el("p", { class: "hint", style: "margin-top: 4px" }, ACTIONS.find((option) => option.value === check.action)?.hint),
		)),
		el("div", { class: "row" },
			el("button", { class: "add", onclick: () => { checks.push({ id: `check-${Date.now()}`, name: "", question: "", sensitivity: "normal", action: "warn" }); edited({ isStructural: true }); } }, "Add a check"),
			el("button", { class: "add", onclick: addStarters }, "Add starter checks"),
		),
	);
}

function renderPolicy() {
	const policy = view.policy;
	document.getElementById("policy").replaceChildren(...nodes(
		policy.about ? el("p", { class: "about" }, policy.about) : null,
		el("ol", { class: "steps" },
			el("li", {}, "Decide what to watch for, how strict to be, and what happens when a check fires."),
			el("li", {}, "Test it on the right with samples until they behave as expected."),
			el("li", {}, "That's it. Changes save on their own, and Cline uses them on its next tool call."),
		),
		el("div", { id: "policy-errors" }),
		renderWhere(),
		renderChecks(),
	));
	renderErrors();
}

function verdictNode(verdict, expect) {
	if (!verdict) return null;
	const flagged = isFlagged(verdict);
	const badge = flagged
		? el("span", { class: `badge ${verdict.action === "note" ? "note" : verdict.action === "warn" ? "warn" : "flag"}` }, `Flagged: ${actionLabel(verdict.action)}`)
		: el("span", { class: "badge pass" }, "Passes");
	const match = expect === undefined ? null : (flagged === (expect === "flag"))
		? el("span", { class: "match good" }, "as expected")
		: el("span", { class: "match bad" }, "not as expected");
	return el("div", { class: "verdict" },
		badge, match,
		el("div", { class: "bars" }, verdict.checks.map((check) => el("div", { class: "bar-row" },
			el("span", { title: check.name }, check.name),
			el("div", { class: "track" }, el("div", { class: `fill ${check.isFired ? "fired" : ""}`, style: `width: ${check.probability * 100}%` }), el("div", { class: "limit", style: `left: ${check.threshold * 100}%`, title: "Fires past this line" })),
			el("span", { class: "num" }, percent(check.probability)),
		))),
		verdict.chunks.filter((chunk) => chunk.isFlagged).map((chunk) => el("div", { class: "flagged-text" }, chunk.text)),
		verdict.isTruncated ? el("p", { class: "hint" }, "Only the first 60,000 characters were checked.") : null,
	);
}

function renderBench() {
	const samples = view.policy.samples;
	const tested = samples.filter((sample) => view.results[sample.id]);
	const good = tested.filter((sample) => isFlagged(view.results[sample.id]) === (sample.expect === "flag"));
	const tryArea = el("textarea", { class: "box", rows: 3, placeholder: "Paste an email, a web page, an issue, anything the agent might read", value: view.tryText, oninput: (event) => { view.tryText = event.target.value; } });
	document.getElementById("bench").replaceChildren(...nodes(
		el("div", { class: "section" },
			sectionHead("Test bench", "Samples act like tests for your guard. Mark what each one should do, then run them.",
				el("button", { class: "primary", id: "test-all", disabled: view.isTesting, onclick: testAll }, view.isTesting ? "Testing" : "Test all samples"),
			),
			view.testError ? el("div", { class: "banner error" }, view.testError) : null,
			tested.length > 0 ? el("p", { class: "score" }, el("b", { class: "num" }, `${good.length} of ${tested.length}`), " samples behave as expected.") : null,
		),
		el("div", { class: "card" },
			el("div", { class: "card-head two" }, el("strong", {}, "Try any text"), el("span")),
			tryArea,
			el("div", { class: "row", style: "margin-top: 8px" },
				el("button", { class: "secondary", onclick: tryOne }, "Check this text"),
				el("button", { class: "add", onclick: () => { if (!view.tryText.trim()) return; samples.push({ id: `s${Date.now()}`, label: "New sample", text: view.tryText, expect: "flag" }); view.tryText = ""; edited(); renderBench(); } }, "Save as a sample"),
			),
			verdictNode(view.tryResult),
		),
		samples.map((sample, index) => el("div", { class: "card" },
			el("div", { class: "card-head" },
				textBox(sample, "label", { placeholder: "Name this sample", className: "box title-box" }),
				segmented([{ value: "pass", label: "Should pass" }, { value: "flag", label: "Should flag" }], sample.expect, (value) => { sample.expect = value; edited(); renderBench(); }, "expect"),
				removeButton(samples, index, "sample", () => { edited(); renderBench(); }),
			),
			areaBox(sample, "text", { rows: 3, placeholder: "A text this agent might read" }),
			verdictNode(view.results[sample.id], sample.expect),
		)),
		el("button", { class: "add", onclick: () => { samples.push({ id: `s${Date.now()}`, label: "", text: "", expect: "pass" }); edited(); renderBench(); } }, "Add a sample"),
		el("div", { class: "section" },
			sectionHead("Caught in Cline", "What this guard did in real Cline sessions. Turn a false alarm or a miss into a sample.",
				el("button", { class: "secondary", onclick: loadLog }, "Refresh"),
			),
			renderLog(),
		),
	));
}

function renderLog() {
	const entries = view.log.filter((entry) => entry.policy === view.slug);
	if (entries.length === 0) return el("p", { class: "empty" }, "Nothing yet. Every tool result this guard checks shows up here.");
	return entries.map((entry) => el("div", { class: "log-row" },
		el("div", { class: "row" },
			entry.status !== "ok" ? el("span", { class: "badge note" }, "Not checked") : entry.fired.length > 0 ? el("span", { class: `badge ${entry.action === "note" ? "note" : entry.action === "warn" ? "warn" : "flag"}` }, actionLabel(entry.action)) : el("span", { class: "badge pass" }, "Passed"),
			el("span", { class: "meta num" }, `${new Date(entry.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} \u00b7 ${entry.tool} \u00b7 ${entry.elapsedMs} ms`),
		),
		entry.fired.length > 0 ? el("p", { class: "hint", style: "margin-top: 4px" }, entry.fired.map((hit) => `${hit.name} ${percent(hit.probability)}`).join(", ")) : null,
		entry.errors ? el("p", { class: "hint" }, entry.errors[0]) : null,
		entry.flaggedText ? el("div", { class: "flagged-text" }, entry.flaggedText) : null,
		entry.flaggedText ? el("div", { class: "row", style: "margin-top: 6px" },
			el("button", { class: "add", onclick: () => { view.policy.samples.push({ id: `s${Date.now()}`, label: `From ${entry.tool}`, text: entry.flaggedText, expect: "flag" }); edited(); renderBench(); } }, "Add as sample (should flag)"),
			el("button", { class: "add", onclick: () => { view.policy.samples.push({ id: `s${Date.now()}`, label: `False alarm from ${entry.tool}`, text: entry.flaggedText, expect: "pass" }); edited(); renderBench(); } }, "Add as sample (should pass)"),
		) : null,
	));
}

async function runTest(texts) {
	return api(`/api/policies/${view.slug}/test`, { method: "POST", body: JSON.stringify({ policy: view.policy, texts }) });
}

async function testAll() {
	const samples = view.policy.samples.filter((sample) => sample.text.trim());
	if (samples.length === 0) return;
	view.isTesting = true;
	view.testError = null;
	renderBench();
	try {
		const run = await runTest(samples.map((sample) => ({ key: sample.id, text: sample.text })));
		if (run.status === "ok") view.results = run.verdicts;
		else view.testError = run.errors.join(" ");
	} catch (error) {
		view.testError = error.message;
	} finally {
		view.isTesting = false;
	}
	renderBench();
}

async function tryOne() {
	if (!view.tryText.trim()) return;
	try {
		const run = await runTest([{ key: "try", text: view.tryText }]);
		view.tryResult = run.verdicts?.try ?? null;
		view.testError = run.status === "ok" ? null : run.errors.join(" ");
	} catch (error) {
		view.testError = error.message;
	}
	renderBench();
}

async function loadLog() {
	view.log = await api("/api/log");
	if (view.policy) renderBench();
}

async function loadPolicyList() {
	const policies = await api("/api/policies");
	document.getElementById("policies").replaceChildren(...policies.map((entry) => el("a", { href: `#${entry.slug}`, class: entry.slug === view.slug ? "active" : "" }, entry.name)));
	return policies;
}

async function openPolicy(slug) {
	if (view.saveTimer) {
		clearTimeout(view.saveTimer);
		await save();
	}
	view.slug = slug;
	view.policy = await api(`/api/policies/${slug}`);
	view.policy.checks ??= [];
	view.policy.samples ??= [];
	view.policy.folders ??= [];
	view.policy.sources ??= ["web", "files", "other"];
	view.results = {};
	view.tryResult = null;
	view.errors = [];
	document.getElementById("name").value = view.policy.name ?? slug;
	document.getElementById("saved").textContent = "";
	document.title = `${view.policy.name} \u00b7 Jev guard`;
	renderPolicy();
	renderStatus();
	renderBench();
	await loadPolicyList();
	await loadLog();
}

async function newPolicy() {
	const name = prompt("Name for the new guard");
	if (!name) return;
	const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "guard";
	await api(`/api/policies/${slug}`, { method: "PUT", body: JSON.stringify({ name, checks: STARTER_CHECKS, samples: [], folders: [], sources: ["web", "files", "other"] }) });
	location.hash = slug;
}

async function start() {
	STARTER_CHECKS = await api("/api/starter-checks");
	document.getElementById("new-policy").addEventListener("click", newPolicy);
	document.getElementById("name").addEventListener("input", (event) => {
		if (!view.policy) return;
		view.policy.name = event.target.value;
		edited();
	});
	window.addEventListener("hashchange", () => openPolicy(location.hash.slice(1)));
	setInterval(() => { if (view.policy && !view.isTesting) loadLog(); }, LOG_REFRESH_MS);
	const policies = await loadPolicyList();
	const slug = location.hash.slice(1) || policies[0]?.slug;
	if (slug) await openPolicy(slug);
	else document.getElementById("policy").replaceChildren(el("p", { class: "empty" }, "No guards yet. Ask Cline to set one up, or make a new one."));
}

start().catch((error) => {
	document.getElementById("bench").replaceChildren(el("div", { class: "banner error" }, `Could not load the guard page: ${error.message}`));
});
</script>
